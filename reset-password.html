<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعادة تعيين كلمة المرور</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;min-height:100vh;display:grid;place-items:center;color:#172033}.card{width:min(92vw,460px);background:white;border-radius:18px;padding:24px;box-shadow:0 12px 40px #0001}.input,.btn{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;margin-top:10px;font-size:16px}.input{border:1px solid #d7dce5}.btn{border:0;background:#243b7b;color:white;cursor:pointer}.ghost{background:#eef2ff;color:#243b7b}.msg{margin-top:12px;padding:10px;border-radius:8px;background:#f4f6fa}.ok{background:#e9f8ee;color:#176b36}.err{background:#fff0f0;color:#a12626}.hidden{display:none}</style>
</head>
<body>
<section class="card">
<h2>إعادة تعيين كلمة المرور</h2>
<div id="requestBox">
<p>اكتب البريد الإلكتروني وسنرسل رابط استرجاع كلمة المرور.</p>
<input id="email" class="input" type="email" placeholder="البريد الإلكتروني" value="sayed.account@proton.me">
<button id="sendBtn" class="btn">إرسال رابط الاسترجاع</button>
</div>
<div id="changeBox" class="hidden">
<p>اكتب كلمة المرور التي تريد تثبيتها للحساب.</p>
<input id="newPassword" class="input" type="password" placeholder="كلمة المرور الجديدة">
<button id="saveBtn" class="btn">حفظ كلمة المرور</button>
</div>
<div id="msg"></div>
<button class="btn ghost" onclick="location.href='/'">العودة لتسجيل الدخول</button>
</section>
<script>
const BASE='https://gnawfgunhhjuivvropbh.supabase.co';
const KEY='sb_publishable_kbNNZfG-2ZzDTfHtD3-jAw_6Nyli_93';
const msg=(t,ok=false)=>document.getElementById('msg').innerHTML=`<div class="msg ${ok?'ok':'err'}">${t}</div>`;
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
const token=hash.get('access_token');
const type=hash.get('type');
if(token && type==='recovery'){
 document.getElementById('requestBox').classList.add('hidden');
 document.getElementById('changeBox').classList.remove('hidden');
}
document.getElementById('sendBtn').onclick=async()=>{
 const email=document.getElementById('email').value.trim().toLowerCase();
 try{
   const r=await fetch(`${BASE}/auth/v1/recover`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:location.origin+'/reset-password.html'})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok) throw Error(j.msg||j.error_description||'تعذر إرسال رابط الاسترجاع');
   msg('تم إرسال رابط الاسترجاع. افتح الرسالة من البريد ثم ارجع لهذه الصفحة.',true);
 }catch(e){msg(e.message)}
};
document.getElementById('saveBtn').onclick=async()=>{
 const password=document.getElementById('newPassword').value;
 if(password.length<8){msg('كلمة المرور يجب أن تكون 8 أحرف على الأقل');return}
 try{
   const r=await fetch(`${BASE}/auth/v1/user`,{method:'PUT',headers:{apikey:KEY,Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({password})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok) throw Error(j.msg||j.error_description||'تعذر تحديث كلمة المرور');
   history.replaceState(null,'',location.pathname);
   msg('تم تحديث كلمة المرور بنجاح. يمكنك الآن العودة وتسجيل الدخول.',true);
 }catch(e){msg(e.message)}
};
</script>
</body>
</html>
