<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أ. محمد سيد للاستشارات المحاسبية</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f5f7fb;color:#172033}.hidden{display:none!important}button,input,select,textarea{font:inherit}.top{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.topin{max-width:1450px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700}.muted{color:#6b7280;font-size:13px}.layout{max-width:1450px;margin:auto;display:grid;grid-template-columns:240px 1fr;gap:16px;padding:16px}.side{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:10px;height:max-content}.nav{width:100%;border:0;background:transparent;padding:11px;border-radius:9px;text-align:right;cursor:pointer}.nav.active,.nav:hover{background:#eef2ff;color:#1e3a8a}.main{min-width:0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:28px;font-weight:700}.btn{border:0;background:#1f3a8a;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}.btn.sec{background:#eef2ff;color:#1e3a8a}.input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap;font-size:13px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eef2ff;color:#1e3a8a}.tag.ind{background:#ecfdf5;color:#166534}.tag.inv{background:#fff7ed;color:#9a3412}.msg{padding:10px;border-radius:9px;margin-top:10px}.err{background:#fef2f2;color:#991b1b}.ok{background:#f0fdf4;color:#166534}.login{max-width:430px;margin:10vh auto}.footer{text-align:center;color:#6b7280;font-size:12px;padding:15px}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.empty{text-align:center;color:#6b7280;padding:22px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.nav{min-width:max-content}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.row{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><div class="card login"><h2>أ. محمد سيد للاستشارات المحاسبية</h2><div class="muted">نظام إدارة العملاء والشركات والملفات الضريبية</div><div style="height:14px"></div><input id="email" class="input" value="sayed.account@proton.me" type="email"><input id="password" class="input" style="margin-top:10px" type="password" placeholder="كلمة المرور"><button id="loginBtn" class="btn" style="margin-top:12px;width:100%">تسجيل الدخول</button><div id="loginMsg"></div><div class="footer">تصميم م. عادل للاتصال 01007400542</div></div></div>
<div id="app" class="hidden"><div class="top"><div class="topin"><div><div class="brand">أ. محمد سيد للاستشارات المحاسبية</div><div id="who" class="muted"></div></div><button id="logout" class="btn sec">تسجيل الخروج</button></div></div><div class="layout"><aside class="side" id="nav"></aside><main class="main"><div id="content"></div><div class="footer">تصميم م. عادل للاتصال 01007400542</div></main></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="toolbar"><h3 id="mtitle" style="margin:0"></h3><button id="mclose" class="btn sec">إغلاق</button></div><div id="mbody"></div></div></div>
<script>
const BASE='https://gnawfgunhhjuivvropbh.supabase.co',KEY='sb_publishable_kbNNZfG-2ZzDTfHtD3-jAw_6Nyli_93';let token=sessionStorage.getItem('acc_token')||'',user=null,profile=null,client=null,company=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleDateString('ar-EG'):'-';
function h(extra={}){return {'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json',...extra}}async function api(table,qs='',opt={}){const r=await fetch(BASE+'/rest/v1/'+table+qs,{...opt,headers:h(opt.headers||{})});const t=await r.text();if(!r.ok)throw new Error(t||('HTTP '+r.status));return t?JSON.parse(t):[]}async function count(table,filter=''){const r=await fetch(BASE+'/rest/v1/'+table+'?select=id'+filter,{method:'HEAD',headers:h({'Prefer':'count=exact'})});if(!r.ok)return 0;return +(r.headers.get('content-range')||'/0').split('/')[1]||0}
const pages=[['dashboard','لوحة التحكم'],['clients','العملاء والشركات'],['tax','الضرائب والإقرارات'],['documents','المستندات'],['tasks','المهام والمواعيد'],['finance','التحصيل والمديونيات'],['users','المستخدمون والصلاحيات']];function renderNav(){nav.innerHTML=pages.map(([k,l])=>'<button class="nav" data-p="'+k+'">'+l+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.p))}function active(p){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.p===p))}function modal(title,html){mtitle.textContent=title;mbody.innerHTML=html;document.getElementById('modal').classList.remove('hidden')}mclose.onclick=()=>document.getElementById('modal').classList.add('hidden');
async function loginNow(){loginMsg.innerHTML='';loginBtn.disabled=true;try{const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'تعذر تسجيل الدخول');token=j.access_token;sessionStorage.setItem('acc_token',token);await boot()}catch(e){loginMsg.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}finally{loginBtn.disabled=false}}loginBtn.onclick=loginNow;logout.onclick=()=>{sessionStorage.removeItem('acc_token');location.reload()};
async function boot(){if(!token)return;try{const r=await fetch(BASE+'/auth/v1/user',{headers:h()});if(!r.ok)throw new Error('انتهت جلسة الدخول');user=await r.json();const ps=await api('profiles','?id=eq.'+user.id+'&select=*');profile=ps[0];if(!profile||!profile.active)throw new Error('الحساب غير فعال');login.classList.add('hidden');app.classList.remove('hidden');who.textContent=(profile.full_name||user.email)+' · '+profile.role;renderNav();await show('dashboard')}catch(e){sessionStorage.removeItem('acc_token');token='';loginMsg.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}
async function show(p){active(p);content.innerHTML='<div class="card">جاري التحميل...</div>';try{if(p==='dashboard')await dashboard();if(p==='clients')await clients();if(p==='tax')await listTax();if(p==='documents')await listDocs();if(p==='tasks')await listTasks();if(p==='finance')await listFinance();if(p==='users')await listUsers()}catch(e){content.innerHTML='<div class="card"><div class="msg err">'+esc(e.message)+'</div></div>'}}
async function dashboard(){content.innerHTML='<div class="grid"><div class="card"><div class="muted">العملاء</div><div class="metric" id="k1">...</div></div><div class="card"><div class="muted">الشركات</div><div class="metric" id="k2">...</div></div><div class="card"><div class="muted">إقرارات مفتوحة</div><div class="metric" id="k3">...</div></div><div class="card"><div class="muted">مهام مفتوحة</div><div class="metric" id="k4">...</div></div></div><div class="card"><h3>حالة النظام</h3><div class="msg ok">تم تسجيل الدخول وقاعدة البيانات متصلة.</div></div>';const vals=await Promise.all([count('clients'),count('companies'),count('company_tax_returns','&status=neq.submitted'),count('tasks','&status=neq.done')]);k1.textContent=vals[0];k2.textContent=vals[1];k3.textContent=vals[2];k4.textContent=vals[3]}
async function clients(){const d=await api('clients','?select=id,name,phone,email,companies(id,name,company_type,status)&order=created_at.desc');content.innerHTML='<div class="card"><div class="toolbar"><h2>العملاء والشركات</h2><button class="btn" id="addClient">+ إضافة عميل</button></div>'+(!d.length?'<div class="empty">لا يوجد عملاء</div>':'<div class="tablewrap"><table class="table"><thead><tr><th>العميل</th><th>الهاتف</th><th>الشركات</th><th></th></tr></thead><tbody>'+d.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.phone)+'</td><td>'+(x.companies||[]).map(c=>'<span class="tag '+(c.company_type==='industrial'?'ind':'inv')+'">'+esc(c.name)+'</span>').join(' ')+'</td><td><button class="btn sec" onclick="openClient(\''+x.id+'\')">فتح</button></td></tr>').join('')+'</tbody></table></div>')+'</div>';addClient.onclick=newClient}
function newClient(){modal('إضافة عميل','<div class="row"><input id="cn" class="input" placeholder="اسم العميل"><input id="cp" class="input" placeholder="الهاتف"><input id="ce" class="input" placeholder="البريد"><input id="ca" class="input" placeholder="العنوان"></div><button id="cs" class="btn" style="margin-top:12px">حفظ</button><div id="cm"></div>');cs.onclick=async()=>{try{await api('clients','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({name:cn.value,phone:cp.value||null,email:ce.value||null,address:ca.value||null,client_type:'individual',status:'active'})});mclose.click();clients()}catch(e){cm.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}}
async function openClient(id){const d=await api('clients','?id=eq.'+id+'&select=*,companies(*)');client=d[0];content.innerHTML='<div class="card"><div class="toolbar"><div><h2>'+esc(client.name)+'</h2><div class="muted">'+esc(client.phone)+'</div></div><button class="btn" id="addCompany">+ إضافة شركة</button></div></div><div class="card"><h3>الشركات التابعة</h3>'+(!(client.companies||[]).length?'<div class="empty">لا توجد شركات</div>':'<div class="grid">'+client.companies.map(c=>'<div class="card"><span class="tag '+(c.company_type==='industrial'?'ind':'inv')+'">'+(c.company_type==='industrial'?'صناعي':'استثماري')+'</span><h3>'+esc(c.name)+'</h3><button class="btn sec" onclick="openCompany(\''+c.id+'\')">فتح ملف الشركة</button></div>').join('')+'</div>')+'</div>';addCompany.onclick=newCompany}
function newCompany(){modal('إضافة شركة','<div class="row"><input id="nco" class="input" placeholder="اسم الشركة"><select id="tco" class="input"><option value="industrial">صناعي</option><option value="investment">استثماري</option></select><input id="taxno" class="input" placeholder="الرقم الضريبي"><input id="cr" class="input" placeholder="السجل التجاري"><input id="act" class="input" placeholder="النشاط"><input id="toff" class="input" placeholder="المأمورية الضريبية"></div><button id="saveco" class="btn" style="margin-top:12px">حفظ</button><div id="comsg"></div>');saveco.onclick=async()=>{try{const r=await api('companies','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({client_id:client.id,name:nco.value,company_type:tco.value,tax_number:taxno.value||null,commercial_register:cr.value||null,activity:act.value||null,tax_office:toff.value||null,status:'active'})});mclose.click();openCompany(r[0].id)}catch(e){comsg.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}}
async function openCompany(id){const d=await api('companies','?id=eq.'+id+'&select=*,clients(*)');company=d[0];client=company.clients;content.innerHTML='<div class="card"><button class="btn sec" onclick="openClient(\''+client.id+'\')">← رجوع للعميل</button><h2>'+esc(company.name)+'</h2><div class="muted">'+(company.company_type==='industrial'?'شركة صناعية':'شركة استثمارية')+' · الرقم الضريبي: '+esc(company.tax_number)+'</div></div><div class="grid"><div class="card"><h3>بيانات الشركة</h3><div>السجل التجاري: '+esc(company.commercial_register)+'</div><div>النشاط: '+esc(company.activity)+'</div><div>المأمورية: '+esc(company.tax_office)+'</div></div><div class="card"><h3>الإقرارات</h3><button class="btn" onclick="newReturn()">+ إضافة إقرار</button></div><div class="card"><h3>المستندات</h3><button class="btn" onclick="newDoc()">+ إضافة مستند</button></div><div class="card"><h3>المهام</h3><button class="btn" onclick="newTask()">+ إضافة مهمة</button></div></div><div id="companyData"></div>';await companyLists()}
async function companyLists(){const [r,d,t]=await Promise.all([api('company_tax_returns','?company_id=eq.'+company.id+'&select=*&order=due_date.desc.nullslast'),api('company_documents','?company_id=eq.'+company.id+'&select=*&order=created_at.desc'),api('tasks','?company_id=eq.'+company.id+'&select=*&order=due_date.asc.nullslast')]);companyData.innerHTML='<div class="card"><h3>الإقرارات الضريبية</h3>'+tbl(r,['tax_type','return_type','period_label','due_date','status'])+'</div><div class="card"><h3>المستندات</h3>'+tbl(d,['document_type','title','financial_year','drive_url'])+'</div><div class="card"><h3>المهام</h3>'+tbl(t,['title','due_date','priority','status'])+'</div>'}
function tbl(a,keys){if(!a.length)return '<div class="empty">لا توجد بيانات</div>';return '<div class="tablewrap"><table class="table"><thead><tr>'+keys.map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+a.map(x=>'<tr>'+keys.map(k=>'<td>'+esc(k.includes('date')?fmt(x[k]):x[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function newReturn(){modal('إضافة إقرار','<div class="row"><input id="rtax" class="input" placeholder="نوع الضريبة"><input id="rtype" class="input" placeholder="نوع الإقرار"><input id="rperiod" class="input" placeholder="الفترة"><input id="rdue" class="input" type="date"><select id="rstatus" class="input"><option value="pending">مطلوب</option><option value="in_progress">جاري الإعداد</option><option value="submitted">تم التقديم</option></select></div><button id="rsave" class="btn" style="margin-top:12px">حفظ</button>');rsave.onclick=async()=>{await api('company_tax_returns','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({company_id:company.id,tax_type:rtax.value,return_type:rtype.value,period_label:rperiod.value||null,due_date:rdue.value||null,status:rstatus.value,created_by:user.id})});mclose.click();companyLists()}}
function newDoc(){modal('إضافة مستند','<div class="row"><input id="dtype" class="input" placeholder="نوع المستند"><input id="dtitle" class="input" placeholder="العنوان"><input id="dyear" class="input" type="number" placeholder="السنة"><input id="durl" class="input" placeholder="رابط Google Drive"></div><button id="dsave" class="btn" style="margin-top:12px">حفظ</button>');dsave.onclick=async()=>{await api('company_documents','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({company_id:company.id,document_type:dtype.value,title:dtitle.value,financial_year:dyear.value?+dyear.value:null,drive_url:durl.value,uploaded_by:user.id})});mclose.click();companyLists()}}
function newTask(){modal('إضافة مهمة','<div class="row"><input id="ttitle" class="input" placeholder="عنوان المهمة"><input id="tdue" class="input" type="date"><select id="tprio" class="input"><option value="normal">عادية</option><option value="high">عالية</option><option value="urgent">عاجلة</option></select></div><button id="tsave" class="btn" style="margin-top:12px">حفظ</button>');tsave.onclick=async()=>{await api('tasks','',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({company_id:company.id,client_id:client.id,title:ttitle.value,due_date:tdue.value||null,priority:tprio.value,status:'open',created_by:user.id})});mclose.click();companyLists()}}
async function listTax(){const r=await api('company_tax_returns','?select=*,companies(name,clients(name))&order=due_date.asc.nullslast&limit=200');content.innerHTML='<div class="card"><h2>الضرائب والإقرارات</h2>'+tbl(r,['tax_type','return_type','period_label','due_date','status'])+'</div>'}async function listDocs(){const r=await api('company_documents','?select=*&order=created_at.desc&limit=200');content.innerHTML='<div class="card"><h2>المستندات</h2>'+tbl(r,['document_type','title','financial_year','drive_url'])+'</div>'}async function listTasks(){const r=await api('tasks','?select=*&order=due_date.asc.nullslast&limit=200');content.innerHTML='<div class="card"><h2>المهام والمواعيد</h2>'+tbl(r,['title','due_date','priority','status'])+'</div>'}async function listFinance(){const r=await api('fees','?select=*&order=created_at.desc&limit=200');content.innerHTML='<div class="card"><h2>التحصيل والمديونيات</h2>'+tbl(r,['description','amount','due_date'])+'</div>'}async function listUsers(){const r=await api('profiles','?select=*&order=created_at.asc');content.innerHTML='<div class="card"><h2>المستخدمون والصلاحيات</h2>'+tbl(r,['full_name','email','role','active'])+'</div>'}
window.openClient=openClient;window.openCompany=openCompany;window.newReturn=newReturn;window.newDoc=newDoc;window.newTask=newTask;boot();
</script></body></html>
